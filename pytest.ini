[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: Critical path smoke tests
    auth: Authentication tests
    real_estate: Real estate module tests
    accounting: Accounting module tests
    hr: HR module tests
    sales: Sales module tests
    crm: CRM module tests
    procurement: Procurement module tests
    inventory: Inventory module tests
    rentals: Rental module tests
    escrow: Escrow module tests
    offplan: Off-plan module tests
    portal: Customer portal tests
    workflow: Approval workflow tests
