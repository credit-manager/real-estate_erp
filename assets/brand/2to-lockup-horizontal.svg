<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <!-- 2TO Horizontal Lockup -->
  <!-- Shield -->
  <g transform="translate(10, 5) scale(0.5)">
    <path d="M0,0 L200,0 L200,175 L100,232 L0,175 Z" fill="#2D4661"/>
    <path d="M0,165 L100,222 L200,165" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <text x="100" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="155" fill="#FFFFFF">2</text>
  </g>
  <!-- Separator -->
  <line x1="120" y1="20" x2="120" y2="100" stroke="#00AEEF" stroke-width="1.5"/>
  <!-- Wordmark -->
  <text x="140" y="55" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="42" fill="#2D4661">2TO</text>
  <text x="140" y="78" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" letter-spacing="5" fill="#6C757D">ENTERPRISE</text>
  <text x="140" y="96" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" letter-spacing="4" fill="#ADB5BD">GOVERNANCE</text>
</svg>