<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">2TO Signature Enterprise Shield</title>
  <desc id="desc">2TO signature shield mark with integrated geometric numeral 2</desc>
  <defs>
    <linearGradient id="shield" x1="94" y1="54" x2="416" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46677F"/>
      <stop offset="0.28" stop-color="#2D4661"/>
      <stop offset="0.62" stop-color="#20384F"/>
      <stop offset="1" stop-color="#0E263A"/>
    </linearGradient>
    <linearGradient id="depth" x1="74" y1="100" x2="424" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27455C"/>
      <stop offset="0.5" stop-color="#112A40"/>
      <stop offset="1" stop-color="#061725"/>
    </linearGradient>
    <linearGradient id="metal" x1="180" y1="128" x2="338" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.16" stop-color="#DCE5EA"/>
      <stop offset="0.33" stop-color="#97A9B5"/>
      <stop offset="0.48" stop-color="#FBFDFE"/>
      <stop offset="0.63" stop-color="#C6D1D8"/>
      <stop offset="0.82" stop-color="#8497A4"/>
      <stop offset="1" stop-color="#EEF2F5"/>
    </linearGradient>
    <linearGradient id="edge" x1="82" y1="48" x2="430" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCE6EB"/>
      <stop offset="0.36" stop-color="#8FA4B2"/>
      <stop offset="0.72" stop-color="#E8EEF2"/>
      <stop offset="1" stop-color="#5A7282"/>
    </linearGradient>
    <linearGradient id="glow" x1="198" y1="136" x2="320" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-24%" y="-22%" width="148%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/>
      <feOffset dy="14"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.015 0 0 0 0 0.065 0 0 0 0 0.11 0 0 0 .38 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="symbolShadow" x="-18%" y="-18%" width="136%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#041421" flood-opacity=".30"/>
    </filter>
    <clipPath id="clipShield">
      <path d="M256 24 L462 88 V263 C462 369 383 433 256 486 C129 433 50 369 50 263 V88 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- Primary shield architecture -->
    <path d="M256 24 L462 88 V263 C462 369 383 433 256 486 C129 433 50 369 50 263 V88 Z" fill="url(#shield)" stroke="#122B40" stroke-width="8" stroke-linejoin="round"/>

    <!-- Structural depth planes -->
    <path d="M50 88 L71 104 V264 C71 351 141 411 256 463 V486 C129 433 50 369 50 263 Z" fill="url(#depth)" opacity=".96"/>
    <path d="M71 263 C71 350 141 410 256 463 C371 410 441 350 441 263 V306 C441 393 371 451 256 501 C141 451 71 393 71 306 Z" fill="#071A2B" opacity=".82"/>

    <!-- Precision perimeter -->
    <path d="M256 39 L448 98 V262 C448 359 377 420 256 470 C135 420 64 359 64 262 V98 Z" stroke="url(#edge)" stroke-width="4" opacity=".86"/>
    <path d="M95 119 V257 C95 327 153 379 256 426 C359 379 417 327 417 257 V119" stroke="#91A4B0" stroke-width="2" stroke-opacity=".18"/>

    <!-- Signature internal frame: creates a distinct architectural identity -->
    <path d="M129 146 H383" stroke="#D5E0E6" stroke-width="2" stroke-opacity=".15"/>
    <path d="M129 146 V262 C129 309 170 348 256 388 C342 348 383 309 383 262 V146" stroke="#D5E0E6" stroke-width="2" stroke-opacity=".12"/>

    <!-- Integrated 2: deliberately geometric, open, and optically centered -->
    <g filter="url(#symbolShadow)">
      <path d="M163 213 C163 161 201 126 257 126 C315 126 350 159 350 210 C350 242 334 264 305 289 L268 320 H351 V368 H158 V313 L248 235 C266 220 276 211 276 201 C276 186 266 178 252 178 C237 178 227 189 225 208 H163 Z" fill="url(#metal)" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Carved inner channel: makes the mark feel engineered rather than typographic -->
      <path d="M194 211 C197 176 220 153 257 153 C300 153 326 176 326 208 C326 229 316 244 291 265 L236 313" stroke="#526A7A" stroke-opacity=".42" stroke-width="7" stroke-linecap="round"/>
      <path d="M194 211 C197 176 220 153 257 153 C300 153 326 176 326 208" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/>

      <!-- Structural T/O cues embedded in the base -->
      <path d="M158 368 H351" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="3"/>
      <path d="M194 343 H318" stroke="#7F919C" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      <path d="M232 350 H280" stroke="#FFFFFF" stroke-opacity=".70" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Controlled brand accent -->
    <path d="M158 395 H351" stroke="#00AEEF" stroke-width="5" stroke-linecap="round" opacity=".88"/>
    <path d="M212 395 H297" stroke="#B7EEFF" stroke-width="2" stroke-linecap="round" opacity=".55"/>

    <!-- Micro highlight only; no decorative noise -->
    <path d="M119 112 L164 98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".26"/>
    <path d="M349 98 L395 112" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".12"/>
  </g>
</svg>