<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="100%"
  height="100%"
  role="img"
  aria-labelledby="title desc"
  shape-rendering="geometricPrecision"
>
  <title id="title">2TO Enterprise Shield</title>
  <desc id="desc">2TO enterprise governance shield master mark</desc>

  <defs>
    <linearGradient id="shield" x1="92" y1="44" x2="420" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#49677F"/>
      <stop offset="0.32" stop-color="#2D4661"/>
      <stop offset="0.72" stop-color="#203A52"/>
      <stop offset="1" stop-color="#10283D"/>
    </linearGradient>

    <linearGradient id="depth" x1="70" y1="90" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18334A"/>
      <stop offset="0.5" stop-color="#0D2438"/>
      <stop offset="1" stop-color="#071725"/>
    </linearGradient>

    <linearGradient id="silver" x1="190" y1="140" x2="330" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.18" stop-color="#E8EEF2"/>
      <stop offset="0.42" stop-color="#A8B5BE"/>
      <stop offset="0.58" stop-color="#F9FBFC"/>
      <stop offset="0.78" stop-color="#CBD5DB"/>
      <stop offset="1" stop-color="#8D9DA7"/>
    </linearGradient>

    <linearGradient id="edge" x1="80" y1="40" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AFC1CD"/>
      <stop offset="0.45" stop-color="#E7EDF1"/>
      <stop offset="1" stop-color="#5D7485"/>
    </linearGradient>

    <linearGradient id="symbolHighlight" x1="205" y1="145" x2="320" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#061522" flood-opacity=".42"/>
    </filter>

    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0B1D2B" flood-opacity=".32"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Primary Shield -->
    <path d="M256 28 L458 92 V266 C458 368 382 430 256 482 C130 430 54 368 54 266 V92 Z" fill="url(#shield)" stroke="#172E43" stroke-width="8" stroke-linejoin="round"/>

    <!-- Left Depth Plane -->
    <path d="M54 92 L72 108 V270 C72 354 140 411 256 463 V482 C130 430 54 368 54 266 Z" fill="url(#depth)" opacity=".96"/>

    <!-- Lower Depth -->
    <path d="M72 270 C72 354 140 411 256 463 C372 411 440 354 440 270 V306 C440 390 372 450 256 498 C140 450 72 390 72 306 Z" fill="url(#depth)" opacity=".88"/>

    <!-- Outer Edge Highlight -->
    <path d="M256 38 L448 98 V264 C448 358 376 420 256 470" fill="none" stroke="url(#edge)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>

    <!-- 2TO Core Symbol -->
    <g filter="url(#symbolShadow)">
      <path d="M166 204 C166 158 201 130 257 130 C314 130 348 161 348 207 C348 240 331 262 301 288 L261 322 H350 V365 H159 V318 L251 238 C266 225 276 215 276 204 C276 190 267 181 253 181 C237 181 226 191 225 208 H166 Z" fill="url(#silver)" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round"/>
      <path d="M174 202 C177 162 209 139 256 139 C303 139 333 163 339 199" fill="none" stroke="url(#symbolHighlight)" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Precision Accent -->
    <path d="M159 378 H350" stroke="#00AEEF" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>