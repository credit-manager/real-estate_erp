<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  fill="none"
  role="img"
  aria-labelledby="title desc"
  shape-rendering="geometricPrecision"
>
  <title id="title">2TO Enterprise Governance</title>
  <desc id="desc">2TO Enterprise Governance master shield identity</desc>

  <defs>
    <linearGradient id="gShield" x1="86" y1="52" x2="426" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#405F77"/>
      <stop offset="0.34" stop-color="#2D4661"/>
      <stop offset="0.68" stop-color="#213A52"/>
      <stop offset="1" stop-color="#11283D"/>
    </linearGradient>

    <linearGradient id="gDepth" x1="72" y1="110" x2="438" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A354B"/>
      <stop offset="0.5" stop-color="#0D2438"/>
      <stop offset="1" stop-color="#061725"/>
    </linearGradient>

    <linearGradient id="gMetal" x1="184" y1="126" x2="336" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.16" stop-color="#EEF3F6"/>
      <stop offset="0.36" stop-color="#B8C4CC"/>
      <stop offset="0.51" stop-color="#FDFEFF"/>
      <stop offset="0.69" stop-color="#D4DDE2"/>
      <stop offset="0.84" stop-color="#9AA9B3"/>
      <stop offset="1" stop-color="#E9EEF1"/>
    </linearGradient>

    <linearGradient id="gEdge" x1="76" y1="50" x2="438" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6C6D0"/>
      <stop offset="0.38" stop-color="#EEF3F6"/>
      <stop offset="0.72" stop-color="#7E94A3"/>
      <stop offset="1" stop-color="#526A7A"/>
    </linearGradient>

    <linearGradient id="gSymbolLight" x1="198" y1="136" x2="314" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="fShadow" x="-24%" y="-24%" width="148%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset in="blur" dx="0" dy="15" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.09  0 0 0 0 0.14  0 0 0 .38 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fSymbol" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#071927" flood-opacity=".28"/>
    </filter>

    <clipPath id="shieldClip">
      <path d="M256 28 L458 91 V263 C458 365 382 429 256 482 C130 429 54 365 54 263 V91 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#fShadow)">
    <path d="M256 28 L458 91 V263 C458 365 382 429 256 482 C130 429 54 365 54 263 V91 Z" fill="url(#gShield)" stroke="#172E43" stroke-width="8" stroke-linejoin="round"/>
    <path d="M54 91 L74 106 V265 C74 349 140 409 256 462 V482 C130 429 54 365 54 263 Z" fill="url(#gDepth)" opacity=".94"/>
    <path d="M74 265 C74 349 140 409 256 462 C372 409 438 349 438 265 V304 C438 389 372 449 256 498 C140 449 74 389 74 304 Z" fill="url(#gDepth)" opacity=".9"/>
    <path d="M256 39 L447 98 V262 C447 356 376 418 256 469" stroke="url(#gEdge)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
    <path d="M103 118 V258 C103 329 158 377 256 421 C354 377 409 329 409 258 V118" stroke="#6F8798" stroke-width="2" stroke-opacity=".20" stroke-linecap="round" fill="none"/>
    <g filter="url(#fSymbol)">
      <path d="M165 205 C165 158 201 130 257 130 C314 130 348 161 348 207 C348 240 331 262 301 288 L261 322 H350 V365 H159 V318 L251 238 C266 225 276 215 276 204 C276 190 267 181 253 181 C237 181 226 191 225 208 H165 Z" fill="url(#gMetal)" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity=".32" stroke-linejoin="round"/>
      <path d="M174 201 C178 162 210 139 256 139 C303 139 332 163 339 199" stroke="url(#gSymbolLight)" stroke-width="7" stroke-linecap="round"/>
      <path d="M177 343 H330" stroke="#FFFFFF" stroke-width="3" stroke-opacity=".26" stroke-linecap="round"/>
    </g>
    <path d="M159 389 H350" stroke="#00AEEF" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>