<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ system_name }} | {{ t('common.login') }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("dp-theme") || "{{ default_theme }}";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <script>
    window.LANG = {{ lang|tojson }};
    window.DEFAULT_LANG = {{ default_lang|tojson }};
    window.T = {{ translations_json|safe }};
  </script>
</head>
<body class="login-body">
  <div class="login-bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="login-floating" style="z-index:10;display:flex;gap:8px;">
    <button class="theme-toggle" id="theme-toggle" title="{{ t('common.light') if is_dark else t('common.dark') }}">
      <svg viewBox="0 0 24 24" class="theme-icon-dark" style="{{ 'display:none;' if is_dark }}"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      <svg viewBox="0 0 24 24" class="theme-icon-light" style="{{ '' if is_dark else 'display:none;' }}"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v2a1 1 0 01-2 0V3a1 1 0 011-1zm0 18a1 1 0 011 1v2a1 1 0 01-2 0v-2a1 1 0 011-1zm9-9a1 1 0 01-1 1h-2a1 1 0 010-2h2a1 1 0 011 1zM5 12a1 1 0 01-1 1H2a1 1 0 010-2h2a1 1 0 011 1zm14.36 6.36a1 1 0 010 1.41l-1.41 1.41a1 1 0 01-1.41-1.41l1.41-1.41a1 1 0 011.41 0zM5.05 5.05a1 1 0 010 1.41L3.64 7.87a1 1 0 01-1.41-1.41l1.41-1.41a1 1 0 011.41 0zm12.02 12.02a1 1 0 010 1.41l-1.41 1.41a1 1 0 01-1.41-1.41l1.41-1.41a1 1 0 011.41 0zM7.87 7.87a1 1 0 010 1.41L6.46 9.7a1 1 0 01-1.41-1.41l1.41-1.41a1 1 0 011.41 0z"/></svg>
    </button>
  </div>
  <button class="lang-toggle lang-toggle-absolute" id="lang-toggle" title="{{ 'English' if lang == 'ar' else 'العربية' }}">
    {{ 'EN' if lang == 'ar' else 'عربي' }}
  </button>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">{% if system_logo %}<img src="{{ system_logo }}" alt="logo" style="width:40px;height:40px;border-radius:10px;object-fit:cover;">{% else %}DP{% endif %}</div>
      </div>
      <h1 class="login-title">{{ system_name }}</h1>
      <p class="login-subtitle">{{ t('app.loginSubtitle') }}</p>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">{{ t('common.username') }}</label>
          <input type="text" id="username" name="username" placeholder="{{ t('login.usernamePlaceholder') }}" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">{{ t('common.password') }}</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" placeholder="{{ t('login.passwordPlaceholder') }}" required>
            <button type="button" class="pw-toggle" tabindex="-1" aria-label="Toggle password visibility">
              <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group" id="access-password-group" style="display:none;">
          <label for="access-password">{{ t('login.accessPassword') }}</label>
          <div class="pw-wrap">
            <input type="password" id="access-password" name="access_password" placeholder="{{ t('login.accessPasswordPlaceholder') }}" autocomplete="off">
            <button type="button" class="pw-toggle" tabindex="-1" aria-label="Toggle password visibility">
              <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="login-error" style="display: none;"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          {{ t('common.login') }}
        </button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
