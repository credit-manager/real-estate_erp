<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Shield pattern tile -->
    <pattern id="shields" x="0" y="0" width="80" height="94.4" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 40 0 L 40 28.8 C 40 36, 34 42, 20 47.2 L 20 47.2 C 6 42, 0 36, 0 28.8 Z"
            fill="none" stroke="#102B3C" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <!-- Diagonal lines pattern -->
    <pattern id="diags" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#0B7285" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#071C2A" opacity="0.05"/>
    </pattern>
    <!-- Large shield watermark -->
    <symbol id="shield-lg" viewBox="0 0 100 118">
      <path d="M 0 0 L 100 0 L 100 72 C 100 90, 85 105, 50 118 C 15 105, 0 90, 0 72 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#F8F9FA"/>
  
  <!-- Layer 1: Subtle dot grid -->
  <rect width="400" height="400" fill="url(#dots)"/>
  
  <!-- Layer 2: Shield watermark -->
  <use href="#shield-lg" x="250" y="200" width="220" height="260" color="#071C2A" opacity="0.03"/>
  
  <!-- Layer 3: Geometric accent lines -->
  <line x1="0" y1="380" x2="400" y2="380" stroke="#0B7285" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="384" x2="300" y2="384" stroke="#102B3C" stroke-width="0.3" opacity="0.1"/>
</svg>