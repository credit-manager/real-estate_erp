<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2TO Logo Preview</title>
<style>
body { margin: 0; padding: 40px; background: #f0f0f0; font-family: Arial, sans-serif; }
.container { max-width: 800px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 40px; }
.logo-row { display: flex; gap: 40px; justify-content: center; align-items: center; margin: 40px 0; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.logo-row.dark { background: #0F2535; }
.logo-item { text-align: center; }
.logo-item img { max-height: 200px; }
.logo-item p { margin-top: 10px; color: #666; font-size: 14px; }
.logo-row.dark .logo-item p { color: #aaa; }
</style>
</head>
<body>
<div class="container">
<h1>2TO Logo Preview - Please Check</h1>

<div class="logo-row">
<div class="logo-item">
<img src="logo-mark.svg?v=3" alt="Symbol">
<p>Symbol (Shield + 2)</p>
</div>
<div class="logo-item">
<img src="logo-2to.svg?v=3" alt="Full Logo">
<p>Full Lockup (Shield + 2TO)</p>
</div>
</div>

<div class="logo-row dark">
<div class="logo-item">
<img src="logo-mark-white.svg?v=3" alt="White Symbol">
<p>White Symbol</p>
</div>
<div class="logo-item">
<img src="logo-mark-3d.svg?v=3" alt="3D Symbol">
<p>3D Symbol</p>
</div>
</div>

</div>
</body>
</html>
