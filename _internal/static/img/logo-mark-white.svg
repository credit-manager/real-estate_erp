<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="100%" height="100%"><defs></defs>
  <defs>
    <linearGradient id="shieldNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A50"/>
      <stop offset="40%" stop-color="#283C4E"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#C8CED6"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A96A2"/>
      <stop offset="100%" stop-color="#5A6672"/>
    </linearGradient>
  </defs>

  <!-- Shield body: flat top, straight sides, deep smooth V chevron -->
  <path d="M16,12 L184,12 L184,165 C184,165 148,168 100,250 C52,168 16,165 16,165 Z"
        fill="none"/>

  <!-- Inner border line 1 -->
  <path d="M22,18 L178,18 L178,162 C178,162 144,165 100,238 C56,165 22,162 22,162 Z"
        fill="none" stroke="#8AA0B4" stroke-width="1.2" opacity="0.55"/>
  <!-- Inner border line 2 -->
  <path d="M27,23 L173,23 L173,159 C173,159 141,162 100,230 C59,162 27,159 27,159 Z"
        fill="none" stroke="#8AA0B4" stroke-width="0.7" opacity="0.30"/>

  <!-- Number 2: shadow -->
  <path d="M92,55 C122,55 148,72 148,100 C148,124 130,140 110,150 L54,196 L146,196"
        transform="translate(0,5)"
        fill="none" stroke="#FFFFFF" opacity="0.18" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>

  <!-- Number 2: bevel -->
  <path d="M92,55 C122,55 148,72 148,100 C148,124 130,140 110,150 L54,196 L146,196"
        fill="none" stroke="#A0ADB8" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Number 2: main silver fill -->
  <path d="M92,55 C122,55 148,72 148,100 C148,124 130,140 110,150 L54,196 L146,196"
        fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Separator line -->
  <path d="M44,212 L156,212" stroke="#7EAAC8" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
</svg>