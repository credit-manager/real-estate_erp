<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="shields" x="0" y="0" width="80" height="94.4" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 40 0 L 40 28.8 C 40 36, 34 42, 20 47.2 C 6 42, 0 36, 0 28.8 Z"
            fill="none" stroke="#D5DADF" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <pattern id="dots-dark" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#D5DADF" opacity="0.04"/>
    </pattern>
    <symbol id="shield-lg" viewBox="0 0 100 118">
      <path d="M 0 0 L 100 0 L 100 72 C 100 90, 85 105, 50 118 C 15 105, 0 90, 0 72 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="400" fill="#071C2A"/>
  
  <!-- Dot grid -->
  <rect width="400" height="400" fill="url(#dots-dark)"/>
  
  <!-- Shield watermark -->
  <use href="#shield-lg" x="250" y="200" width="220" height="260" color="#D5DADF" opacity="0.03"/>
  
  <!-- Teal accent line -->
  <line x1="0" y1="380" x2="400" y2="380" stroke="#0B7285" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="384" x2="300" y2="384" stroke="#D5DADF" stroke-width="0.3" opacity="0.1"/>
</svg>