  </defs>
  <g transform="translate(20, 15)" filter="url(#deepShadow)">
    <path d="M 15 15 L 135 15 L 135 100 L 75 155 L 15 100 Z" fill="url(#shieldNavy)" stroke="url(#techBlue)" stroke-width="3" stroke-linejoin="round" />
    <path d="M 25 95 L 75 142 L 125 95" fill="none" stroke="url(#techBlue)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <path d="M 52 50 C 52 38, 98 38, 98 52 C 98 68, 52 82, 52 105 L 100 105 L 100 118 L 45 118 L 45 100 C 72 78, 84 70, 84 55 C 84 48, 66 46, 54 52 Z" fill="url(#silverMetallic)" />
  </g>
  <g transform="translate(180, 125)">
    <text font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="105" font-weight="900" fill="#0B2545" letter-spacing="2">TO</text>
  </g>
  <g transform="translate(185, 158)">
    <text font-family="'Segoe UI', 'Arial', sans-serif" font-size="16" font-weight="700" fill="#00AEEF" letter-spacing="5">ENTERPRISE OS</text>
  </g>
