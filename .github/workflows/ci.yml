name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install quality tools
        run: python -m pip install ruff pip-audit
      - name: Lint production entrypoints
        run: |
          ruff check app.py desktop.py config.py server_config.py desktop_sqlite_compat.py installer.py webview2_runtime.py --select E,F,W --ignore E501,E302,E303,F401,F811,E401
      - name: Compile check
        run: python -m py_compile app.py desktop.py config.py server_config.py desktop_sqlite_compat.py installer.py webview2_runtime.py
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Full backend test suite
        env:
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          SECRET_KEY: test-application-secret-key-for-ci
          DYNAMICPRO_ENV: test
        run: pytest -q --disable-warnings --maxfail=1
      - name: Application smoke test
        env:
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          SECRET_KEY: test-application-secret-key-for-ci
          DYNAMICPRO_ENV: test
        run: |
          python -c "
          from app import create_app
          app = create_app()
          print('APP CREATED OK')
          client = app.test_client()
          r = client.get('/health')
          print('HEALTH:', r.status_code, r.get_json())
          assert r.status_code == 200
          print('ALL SMOKE TESTS PASS')
          "

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  desktop:
    runs-on: windows-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Download WebView2 Evergreen Standalone Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\webview2" | Out-Null
          $url = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          $output = "assets\webview2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          if (-not (Test-Path $output)) {
            throw "WebView2 Runtime installer was not downloaded"
          }
          $item = Get-Item $output
          if ($item.Length -lt 10MB) {
            throw "Downloaded WebView2 Runtime installer is unexpectedly small: $($item.Length) bytes"
          }
          $signature = Get-AuthenticodeSignature $output
          if ($signature.Status -ne "Valid") {
            throw "WebView2 Runtime installer signature validation failed: $($signature.Status)"
          }
          Get-Item $output | Format-List FullName,Length
          $signature | Format-List Status,SignerCertificate
      - name: Build DynamicPro.exe
        run: python -m PyInstaller --clean --noconfirm DynamicPro.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DynamicPro.exe")) {
            throw "DynamicPro.exe was not produced"
          }
          Get-Item "dist\DynamicPro.exe" | Format-List FullName,Length
      - name: Frozen executable smoke test
        shell: pwsh
        env:
          DYNAMICPRO_SMOKE_TEST: "1"
          DYNAMICPRO_DESKTOP: "1"
        run: |
          $p = Start-Process -FilePath "dist\DynamicPro.exe" -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $p.Id -Timeout 90 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) {
              throw "DynamicPro.exe frozen smoke test timed out."
            }
            if ($p.ExitCode -ne 0) {
              throw "DynamicPro.exe frozen smoke test failed with exit code $($p.ExitCode)."
            }
          }
          finally {
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Build self-contained setup
        run: python -m PyInstaller --clean --noconfirm DynamicPro-Setup.spec
      - name: Verify setup executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DynamicPro-Setup.exe")) {
            throw "DynamicPro-Setup.exe was not produced"
          }
          Get-Item "dist\DynamicPro-Setup.exe" | Format-List FullName,Length
      - name: Setup executable smoke test
        shell: pwsh
        env:
          DYNAMICPRO_SETUP_SMOKE_TEST: "1"
        run: |
          $p = Start-Process -FilePath "dist\DynamicPro-Setup.exe" -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) {
              throw "DynamicPro-Setup.exe smoke test timed out."
            }
            if ($p.ExitCode -ne 0) {
              throw "DynamicPro-Setup.exe smoke test failed with exit code $($p.ExitCode)."
            }
          }
          finally {
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Real installer payload installation smoke test
        shell: pwsh
        env:
          DYNAMICPRO_SETUP_INSTALL_SMOKE_TEST: "1"
        run: |
          $p = Start-Process -FilePath "dist\DynamicPro-Setup.exe" -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) {
              throw "DynamicPro-Setup.exe installation smoke test timed out."
            }
            if ($p.ExitCode -ne 0) {
              throw "DynamicPro-Setup.exe installation smoke test failed with exit code $($p.ExitCode)."
            }
          }
          finally {
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Verify release payload hashes
        shell: pwsh
        run: |
          $files = @("dist\DynamicPro.exe", "dist\DynamicPro-Setup.exe")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release payload: $file" }
            Get-FileHash $file -Algorithm SHA256 | Format-List
          }
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DynamicPro-Windows
          path: |
            dist/DynamicPro.exe
            dist/DynamicPro-Setup.exe
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -t dp-app:latest .
      - name: Build frontend image
        run: docker build -t dp-frontend:latest ./frontend
