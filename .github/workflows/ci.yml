name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install production dependency set
        run: python -m pip install -r requirements-production.txt
      - name: Install quality tools
        run: python -m pip install ruff pip-audit
      - name: Verify application source integrity
        shell: bash
        run: |
          test "$(wc -c < app.py)" -gt 10000
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("app.py").read_text(encoding="utf-8")
          ast.parse(source, filename="app.py")
          forbidden = ('generate_password_hash("admin123")', 'password_hash=generate_password_hash("admin123")')
          assert not any(marker in source for marker in forbidden), "legacy bootstrap credential found in app.py"
          required = ("def create_app", "@app.route(\"/health\")", "@app.route(\"/ready\")")
          for marker in required:
              assert marker in source, f"missing required application marker: {marker}"
          print(f"app.py integrity OK: {len(source)} bytes")
          PY
      - name: Verify production architecture guards
        shell: bash
        run: |
          test -d migrations/versions
          test -n "$(find migrations/versions -maxdepth 1 -name '*.py' -not -name '__init__.py' -print -quit)"
          python - <<'PY'
          from pathlib import Path
          api = Path("frontend/src/lib/api.ts").read_text(encoding="utf-8")
          auth = Path("frontend/src/contexts/AuthContext.tsx").read_text(encoding="utf-8")
          nginx = Path("deployment/nginx/nginx.conf").read_text(encoding="utf-8")
          docker = Path("Dockerfile").read_text(encoding="utf-8")
          combined = api + auth
          forbidden_browser_tokens = ("localStorage.getItem(\"access_token\")", "localStorage.setItem(\"access_token\")", "localStorage.setItem(\"refresh_token\")", "sessionStorage.setItem(\"access_token\")")
          assert not any(marker in combined for marker in forbidden_browser_tokens), "browser JWT persistence detected"
          assert "withCredentials: true" in api and "X-CSRF-Token" in api, "session CSRF transport is missing"
          assert "location = /health" in nginx and "proxy_pass http://backend/health" in nginx, "nginx health is not backend-aware"
          assert "USER dynamicpro" in docker, "container must run as non-root dynamicpro user"
          print("production architecture guards OK")
          PY
      - name: Lint production entrypoints and authentication
        run: |
          ruff check app.py desktop.py config.py server_config.py desktop_sqlite_compat.py installer.py webview2_runtime.py routes/auth.py migrations/env.py migrations/versions --select E,F,W --ignore E501,E302,E303,F401,F811,E401
      - name: Compile check
        run: python -m py_compile app.py desktop.py config.py server_config.py desktop_sqlite_compat.py installer.py webview2_runtime.py routes/auth.py migrations/env.py migrations/versions/*.py
      - name: Dependency vulnerability audit
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-production.txt --progress-spinner off
      - name: Full backend test suite
        env:
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          SECRET_KEY: test-application-secret-key-for-ci
          DYNAMICPRO_ENV: test
        run: pytest -q --disable-warnings --maxfail=1
      - name: Migration revision contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          revisions = []
          for path in sorted(Path("migrations/versions").glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              values = {}
              for node in tree.body:
                  if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name) and node.targets[0].id in {"revision", "down_revision"}:
                      try:
                          values[node.targets[0].id] = ast.literal_eval(node.value)
                      except Exception:
                          pass
              if "revision" in values:
                  revisions.append((path.name, values.get("revision"), values.get("down_revision")))
          assert revisions, "no Alembic revisions found"
          ids = [r[1] for r in revisions]
          assert len(ids) == len(set(ids)), "duplicate Alembic revision identifiers"
          roots = [r for r in revisions if r[2] is None]
          assert len(roots) == 1, f"expected one Alembic root revision, found {roots}"
          print("Alembic revision contract OK:", revisions)
          PY
      - name: Clean database migration smoke test
        env:
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          SECRET_KEY: test-application-secret-key-for-ci
          DYNAMICPRO_ENV: test
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(
              host=os.environ["DB_HOST"], port=int(os.environ["DB_PORT"]),
              user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"],
              dbname=os.environ["DB_NAME"],
          )
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("DROP SCHEMA public CASCADE")
              cur.execute("CREATE SCHEMA public")
          conn.close()
          PY
          alembic upgrade head
      - name: Application smoke test
        env:
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          SECRET_KEY: test-application-secret-key-for-ci
          DYNAMICPRO_ENV: test
        run: |
          python -c "
          from app import create_app
          app = create_app()
          print('APP CREATED OK')
          client = app.test_client()
          for path in ('/health', '/ready'):
              r = client.get(path)
              print(path.upper() + ':', r.status_code, r.get_json())
              assert r.status_code == 200
          print('ALL SMOKE TESTS PASS')
          "

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck
      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  desktop:
    runs-on: windows-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Download WebView2 Evergreen Standalone Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets\webview2" | Out-Null
          $url = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          $output = "assets\webview2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          if (-not (Test-Path $output)) { throw "WebView2 Runtime installer was not downloaded" }
          $item = Get-Item $output
          if ($item.Length -lt 10MB) { throw "Downloaded WebView2 Runtime installer is unexpectedly small: $($item.Length) bytes" }
          $signature = Get-AuthenticodeSignature $output
          if ($signature.Status -ne "Valid") { throw "WebView2 Runtime signature validation failed: $($signature.Status)" }
      - name: Build DynamicPro.exe
        run: python -m PyInstaller --clean --noconfirm DynamicPro.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DynamicPro.exe")) { throw "DynamicPro.exe was not produced" }
          Get-Item "dist\DynamicPro.exe" | Format-List FullName,Length
      - name: Frozen executable smoke test
        shell: pwsh
        env:
          DYNAMICPRO_SMOKE_TEST: "1"
          DYNAMICPRO_DESKTOP: "1"
        run: |
          $p = Start-Process -FilePath "dist\DynamicPro.exe" -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $p.Id -Timeout 90 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { throw "DynamicPro.exe frozen smoke test timed out." }
            if ($p.ExitCode -ne 0) { throw "DynamicPro.exe frozen smoke test failed with exit code $($p.ExitCode)." }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Build self-contained setup
        run: python -m PyInstaller --clean --noconfirm DynamicPro-Setup.spec
      - name: Verify setup executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DynamicPro-Setup.exe")) { throw "DynamicPro-Setup.exe was not produced" }
          Get-Item "dist\DynamicPro-Setup.exe" | Format-List FullName,Length
      - name: Setup executable smoke test
        shell: pwsh
        env:
          DYNAMICPRO_SETUP_SMOKE_TEST: "1"
        run: |
          $p = Start-Process -FilePath "dist\DynamicPro-Setup.exe" -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { throw "DynamicPro-Setup.exe smoke test timed out." }
            if ($p.ExitCode -ne 0) { throw "DynamicPro-Setup.exe smoke test failed with exit code $($p.ExitCode)." }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Real installer payload installation smoke test
        shell: pwsh
        env:
          DYNAMICPRO_SETUP_INSTALL_SMOKE_TEST: "1"
        run: |
          $p = Start-Process -FilePath "dist\DynamicPro-Setup.exe" -PassThru -WindowStyle Hidden
          try {
            Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { throw "DynamicPro-Setup.exe installation smoke test timed out." }
            if ($p.ExitCode -ne 0) { throw "DynamicPro-Setup.exe installation smoke test failed with exit code $($p.ExitCode)." }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Verify release payload hashes
        shell: pwsh
        run: |
          $files = @("dist\DynamicPro.exe", "dist\DynamicPro-Setup.exe")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release payload: $file" }
            Get-FileHash $file -Algorithm SHA256 | Format-List
          }
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DynamicPro-Windows
          path: |
            dist/DynamicPro.exe
            dist/DynamicPro-Setup.exe
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -t dp-app:latest .
      - name: Build frontend image
        run: docker build -t dp-frontend:latest ./frontend
      - name: Verify backend image runs as non-root
        run: |
          test "$(docker inspect -f '{{.Config.User}}' dp-app:latest)" = "dynamicpro"
      - name: Verify frontend image
        run: |
          test -n "$(docker inspect -f '{{.Id}}' dp-frontend:latest)"