name: Refresh Frontend Dependencies

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile from declared production-safe versions
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify dependency tree
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: regenerate frontend lockfile [skip ci]"
          git push
