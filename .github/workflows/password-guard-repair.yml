name: Harden Password Change Guard

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[password-guard-repaired]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fail-open password guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''            except Exception:\n                pass\n\n    return app\n'''
          new = '''            except Exception as exc:\n                current_app.logger.error("Password-change enforcement failed closed", exc_info=True)\n                if request.path.startswith("/api/"):\n                    return jsonify({"success": False, "message": "تعذر التحقق من حالة كلمة المرور", "code": "password_guard_unavailable"}), 503\n                return _error_html("503", "تعذر التحقق من حالة كلمة المرور"), 503\n\n    return app\n'''
          if old not in s:
              raise SystemExit('password guard target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "security: make password guard fail closed [password-guard-repaired]"
          git push
