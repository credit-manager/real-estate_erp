name: Apply App Production Hardening

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  harden:
    if: "!contains(github.event.head_commit.message, '[app-hardened]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production hardening
        run: python tools/app_production_hardening.py
      - name: Validate transformation
        run: python -m py_compile app.py runtime_hardening.py config.py
      - name: Commit hardened application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "security: remove hard-coded bootstrap credentials and enforce production readiness [app-hardened]"
          git push
