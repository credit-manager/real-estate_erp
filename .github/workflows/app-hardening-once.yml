name: Apply App Production Hardening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production hardening repair
        run: python tools/post_hardening_repair.py
      - name: Validate production modules
        run: python -m py_compile app.py runtime_hardening.py config.py
