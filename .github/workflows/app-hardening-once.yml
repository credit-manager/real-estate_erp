name: Restore And Harden App Entrypoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repaired application entrypoint
        run: |
          python -m py_compile app.py runtime_hardening.py config.py
          test "$(wc -c < app.py)" -gt 10000
