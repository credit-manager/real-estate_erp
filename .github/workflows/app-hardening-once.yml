name: Apply App Production Hardening

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  harden:
    if: "!contains(github.event.head_commit.message, '[post-hardened]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair application hardening
        run: python tools/post_hardening_repair.py
      - name: Validate transformation
        run: python -m py_compile app.py runtime_hardening.py config.py
      - name: Commit repaired application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "security: make health and licensing failure behavior fail-closed [post-hardened]"
          git push
