name: Generate Initial Alembic Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baseline_user
          POSTGRES_PASSWORD: baseline_pass
          POSTGRES_DB: baseline_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baseline_user -d baseline_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-production.txt
      - name: Generate and validate baseline without mutating repository
        env:
          DB_USER: baseline_user
          DB_PASSWORD: baseline_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: baseline_db
          JWT_SECRET_KEY: baseline-jwt-secret-for-ci
          SECRET_KEY: baseline-application-secret-for-ci
          DYNAMICPRO_ENV: test
          RATELIMIT_STORAGE_URI: redis://127.0.0.1:6379/0
        run: |
          python -m alembic revision --autogenerate -m "initial ORM schema"
          file="$(find migrations/versions -maxdepth 1 -type f -name '*.py' -print | sort | tail -n 1)"
          test -n "$file"
          grep -q '^revision = ' "$file"
          grep -q '^down_revision = ' "$file"
          python -m py_compile "$file"
          echo "Generated baseline: $file"
          python -m alembic upgrade head