name: Fix Password Guard Lint

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[password-guard-lint-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused exception binding
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          target = '            except Exception as exc:\n                current_app.logger.error("Password-change enforcement failed closed", exc_info=True)'
          replacement = '            except Exception:\n                current_app.logger.error("Password-change enforcement failed closed", exc_info=True)'
          if target not in s:
              raise SystemExit('expected password guard block not found')
          p.write_text(s.replace(target, replacement, 1), encoding='utf-8')
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "ci: fix password guard lint issue [password-guard-lint-fixed]"
          git push
