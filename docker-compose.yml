# DynamicPro ERP Control Center — Production Docker Compose
services:
  postgres:
    image: postgres:16-alpine
    container_name: dp-master-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dynamicpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-dynamicpro}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dynamicpro} -d ${DB_NAME:-dynamicpro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [dp-network]

  redis:
    image: redis:8-alpine
    container_name: dp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [dp-network]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp-app
    restart: unless-stopped
    env_file: [.env]
    environment:
      DYNAMICPRO_ENV: production
      DYNAMICPRO_MODE: production
      DB_HOST: postgres
      DB_PORT: 5432
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./logs:/app/logs
      - app_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks: [dp-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dp-frontend
    restart: unless-stopped
    depends_on: [app]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    networks: [dp-network]

  nginx:
    image: nginx:1.27-alpine
    container_name: dp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on: [app, frontend]
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=8m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [dp-network]

  backup:
    image: postgres:16-alpine
    container_name: dp-backup
    restart: unless-stopped
    env_file: [.env]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER:-dynamicpro}
      DB_NAME: ${DB_NAME:-dynamicpro}
      DB_HOST: postgres
      BACKUP_RETENTION: ${BACKUP_RETENTION:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./deployment/backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /backups -maxdepth 1 -type f -name 'dp_*.sql.gz' -mmin -2880 -print -quit)\""]
      interval: 1h
      timeout: 10s
      retries: 3
    networks: [dp-network]

volumes:
  postgres_data:
  redis_data:
  app_uploads:

networks:
  dp-network:
    driver: bridge
